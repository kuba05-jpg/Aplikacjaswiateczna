services:
  - type: web
    name: rodzinne-mikolajki
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mikolajki-db
          property: connectionString

databases:
  - name: mikolajki-db
    databaseName: mikolajki
    user: mikolajki
    region: frankfurt
    plan: free
    ipAllowList: []
